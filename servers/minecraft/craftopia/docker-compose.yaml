services:
  minecraft:
    image: ${MINECRAFT_IMAGE:-itzg/minecraft-server:2026.8.2-java25}
    restart: unless-stopped
    stop_grace_period: 2m
    ports:
      - "${MINECRAFT_PORT:-25565}:25565"
    environment:
      EULA: "TRUE"
      TZ: ${TZ:-America/Los_Angeles}

      # Runtime and loader
      TYPE: ${MINECRAFT_TYPE:-FORGE}
      VERSION: ${MINECRAFT_VERSION:-26.2}
      MEMORY: ${MEMORY:-4G}

      # Desired server configuration
      SERVER_NAME: ${SERVER_NAME:-Craftopia}
      SEED: ${SEED:-8500081009970950196}
      ENABLE_WHITELIST: ${ENABLE_WHITELIST:-true}
      # RCON owns membership; preserve /data/whitelist.json across restarts.
      EXISTING_WHITELIST_FILE: "SKIP"
      DIFFICULTY: ${DIFFICULTY:-normal}
      ENABLE_COMMAND_BLOCK: ${ENABLE_COMMAND_BLOCK:-true}
      PLAYER_IDLE_TIMEOUT: ${PLAYER_IDLE_TIMEOUT:-30}
      MAX_PLAYERS: ${MAX_PLAYERS:-50}
      ENABLE_ROLLING_LOGS: ${ENABLE_ROLLING_LOGS:-true}
      ENABLE_AUTOPAUSE: ${ENABLE_AUTOPAUSE:-false}

      # RCON stays private and is shared with trusted services in this stack.
      ENABLE_RCON: "true"
      RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in Coolify}

      # One project slug or pinned project version per line.
      MODRINTH_PROJECTS: |
        fallingtree:26.2-26.2.0.3
    volumes:
      - craftopia-data:/data

  rcon-web:
    # Multi-architecture image pinned for reproducible deployments.
    image: ${RCON_WEB_IMAGE:-itzg/rcon@sha256:c9521f333bf9eaedf2db0acd750e67be88eaaa9c5e9026385bd875dc18a49110}
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      RWA_ENV: "TRUE"
      RWA_USERNAME: ${RCON_WEB_USERNAME:-admin}
      RWA_PASSWORD: ${RCON_WEB_PASSWORD:?Set a separate RCON_WEB_PASSWORD in Coolify}
      RWA_ADMIN: "TRUE"
      RWA_GAME: minecraft
      RWA_SERVER_NAME: ${SERVER_NAME:-Craftopia}
      RWA_RCON_HOST: minecraft
      RWA_RCON_PORT: "25575"
      RWA_RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in Coolify}
      RWA_WEB_RCON: "FALSE"
      # The console proxy serves the page and /ws on the same endpoint.
      RWA_WEBSOCKET_URL: ${RCON_WEB_WEBSOCKET_URL:-ws://localhost:4326/ws}
      RWA_WEBSOCKET_URL_SSL: ${RCON_WEB_WEBSOCKET_URL_SSL:-wss://console.mc.alextac.com/ws}
    volumes:
      - craftopia-rcon-web:/opt/rcon-web-admin/db

  console:
    build:
      context: ./console
    restart: unless-stopped
    depends_on:
      rcon-web:
        condition: service_started
    ports:
      - "${RCON_WEB_BIND_ADDRESS:-127.0.0.1}:4326:8080"

  backups:
    image: ${BACKUP_IMAGE:-itzg/mc-backup:2026.8.2}
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    environment:
      TZ: ${TZ:-America/Los_Angeles}
      RCON_HOST: minecraft
      RCON_PASSWORD: ${RCON_PASSWORD:?Set RCON_PASSWORD in Coolify}
      INITIAL_DELAY: "0"
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-24h}
      PAUSE_IF_NO_PLAYERS: ${PAUSE_IF_NO_PLAYERS:-true}
      PRUNE_BACKUPS_COUNT: ${PRUNE_BACKUPS_COUNT:-7}
      PRUNE_BACKUPS_DAYS: ${PRUNE_BACKUPS_DAYS:-30}
      BACKUP_NAME: craftopia
    volumes:
      - craftopia-data:/data:ro
      - craftopia-backups:/backups

  tunnel:
    build:
      context: ./tunnel
    restart: unless-stopped
    depends_on:
      minecraft:
        condition: service_healthy
    read_only: true
    tmpfs:
      # The image runs as UID/GID 10001, so make the private tmpfs writable by
      # that account instead of Docker's default root ownership.
      - /tmp:size=1m,mode=0700,uid=10001,gid=10001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SSH_TUNNEL_HOST: ${SSH_TUNNEL_HOST:-mc.alextac.com}
      SSH_TUNNEL_PORT: ${SSH_TUNNEL_PORT:-25522}
      SSH_TUNNEL_USER: ${SSH_TUNNEL_USER:-minecraft-tunnel}
      SSH_TUNNEL_BIND_ADDRESS: ${SSH_TUNNEL_BIND_ADDRESS:-0.0.0.0}
      SSH_TUNNEL_REMOTE_PORT: ${SSH_TUNNEL_REMOTE_PORT:-25565}
      SSH_TUNNEL_TARGET_HOST: minecraft
      SSH_TUNNEL_TARGET_PORT: "25565"
      SSH_TUNNEL_PRIVATE_KEY: ${SSH_TUNNEL_PRIVATE_KEY:?Set the tunnel private key in Coolify}
      SSH_TUNNEL_KNOWN_HOSTS: ${SSH_TUNNEL_KNOWN_HOSTS:?Set the verified VPS host key in Coolify}

volumes:
  craftopia-data:
  craftopia-backups:
  craftopia-rcon-web:
