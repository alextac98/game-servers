# Coolify terminates HTTPS. This internal proxy combines the UI and WebSocket.
server {
    listen 8080;
    server_name _;

    # Re-resolve the service after Docker replaces the rcon-web container.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $rcon_backend rcon-web;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;

    location = /ws {
        proxy_pass http://$rcon_backend:4327;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://$rcon_backend:4326;
    }
}
